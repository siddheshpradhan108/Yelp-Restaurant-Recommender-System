name: ecommerce-pdp-recommender

on:
  push:
    paths:
      - "ecommerce_pdp_recommender/**"
      - ".github/workflows/ecommerce-pdp-recommender.yml"
  pull_request:
    paths:
      - "ecommerce_pdp_recommender/**"
      - ".github/workflows/ecommerce-pdp-recommender.yml"

defaults:
  run:
    working-directory: ecommerce_pdp_recommender

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ecommerce_pdp_recommender/requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Unit tests
        run: pytest -q
      - name: Smoke pipeline
        run: python scripts/run_pipeline.py --config configs/smoke.yaml run-all
